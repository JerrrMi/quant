# AltShort Backtest 离线回放
# 不涉及交易所密钥或 SaaS WebSocket。
data:
  provider: "file"
  path: "./data/bars"
  symbol: "BTCUSDT"

fees:
  maker_bps: 2
  taker_bps: 5

slippage:
  bps: 1

replay:
  window:
    start: ""
    end: ""
  warmup_bars: 50

simulation:
  command_deadline_ms: 120000
  lot_step: 0.001
  use_taker_fees: true
  failure_rate: 0
  partial_fill_prob: 0
  partial_fill_min_frac: 0.5
  partial_fill_max_frac: 1
  delay_bars: 0
  funding_bps_per_day: 0
  rng_seed: 42

lppl:
  enabled: false
  bubble_metric_01: 0
  job_id: ""

capital:
  initial_quote: "100000"
  currency: "USDT"

model:
  id: "backtest_model_default"
  values:
    signal_lookback: 20
    position_target: -0.05

logging:
  level: "info"

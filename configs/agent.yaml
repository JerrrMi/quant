# AltShort Agent 执行端
# 默认路径：configs/agent.yaml（项目内等价于运维意义上的 config.agent.yaml）。
# 凭证：以下为 **环境变量名** 占位；勿把真实密钥写入仓库。
identity:
  client_id: "local-dev-agent"

binance:
  api_key_env: "ALTSHORT_BINANCE_API_KEY"
  api_secret_env: "ALTSHORT_BINANCE_API_SECRET"
  use_testnet: true

connection:
  saas_ws_url: "ws://127.0.0.1:8080/v1/agent"
  local_bind_addr: "0.0.0.0:0"
  dial_timeout_seconds: 30
  tls_insecure_skip_verify: false
  heartbeat_interval_seconds: 25

exchange:
  name: "binance"

reconnect:
  max_attempts: 12
  initial_backoff_seconds: 2
  max_backoff_seconds: 120
  jitter_ratio: 0.2

risk:
  max_open_orders: 20
  max_notional_quote_per_order: "5000"
  max_daily_loss_quote: "2500"

local_store:
  sqlite_dsn: ""

logging:
  level: "info"
